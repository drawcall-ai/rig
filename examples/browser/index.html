<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rigs</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #1d1f21; color: #ddd; font: 13px system-ui, sans-serif; }
      header { display: flex; gap: 6px; align-items: center; padding: 8px 12px; flex-wrap: wrap; }
      header button { background: #2a2d31; color: #ddd; border: 1px solid #3a3e44; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
      header button[aria-selected='true'] { background: #ffd23f; color: #111; border-color: #ffd23f; }
      header label { margin-left: 8px; }
      #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
      #status { padding: 0 12px 8px; color: #9aa4b1; font: 12px ui-monospace, monospace; max-height: 30vh; overflow: auto; }
      #status details { display: inline; white-space: pre-wrap; }
      #status summary { display: inline; cursor: pointer; color: #ffd23f; }
      main { flex: 1; min-height: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <header>
      <div id="tabs" role="tablist"></div>
      <label><input id="play" type="checkbox" checked /> Play</label>
      <label><input id="bones" type="checkbox" checked /> Skeleton</label>
      <label><input id="xray" type="checkbox" /> X-ray</label>
    </header>
    <div id="status"></div>
    <main id="view"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
