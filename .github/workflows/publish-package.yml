name: Publish Package

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    # macOS arm64: @onirenaud/node-webgl (headless render tests) ships no Linux build
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check npm
        run: npm --version

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: "5.x"

      - name: GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0

      - name: Typecheck
        run: pnpm --filter "./packages/*" typecheck

      - name: Build
        run: pnpm --filter "./packages/*" build

      - name: Test
        run: pnpm --filter "./packages/*" test

      - name: Set package version
        working-directory: ./packages/rig
        run: npm pkg set version="${{ steps.gitversion.outputs.fullSemVer }}"

      # pnpm (not npm) publish: it applies publishConfig, which swaps the src exports used in the
      # workspace for the built dist ones, then hands the tarball to npm for OIDC and provenance.
      - name: Publish @drawcall/rig
        working-directory: ./packages/rig
        run: pnpm publish --access public --no-git-checks --provenance --tag latest
